name: Deploy Next.js via Docker

on:
  push:
    branches:
      - master  # or main, depending on your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub (optional)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t my-nextjs-app .

      # Example: Push image to DockerHub (optional)
      - name: Push Docker image to DockerHub
        run: |
          docker tag my-nextjs-app ${{ secrets.DOCKER_USERNAME }}/my-nextjs-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/my-nextjs-app:latest

      # Optional: Deploy via SSH (replace with your logic)
      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-nextjs-app:latest
            docker stop my-nextjs-app || true
            docker rm my-nextjs-app || true
            docker run -d -p 3000:3000 --name my-nextjs-app ${{ secrets.DOCKER_USERNAME }}/my-nextjs-app:latest
